<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" style="background:#06000d;">
  <defs>
    <filter id="sg">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg2">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0040"/>
      <stop offset="100%" stop-color="#ff6633"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0040"/>
      <stop offset="100%" stop-color="#cc0030"/>
    </linearGradient>
  </defs>

  <!-- Background grid lines -->
  <line x1="0"   y1="40"  x2="900" y2="40"  stroke="#1a0010" stroke-width="1"/>
  <line x1="0"   y1="80"  x2="900" y2="80"  stroke="#1a0010" stroke-width="1"/>
  <line x1="0"   y1="120" x2="900" y2="120" stroke="#1a0010" stroke-width="1"/>
  <line x1="0"   y1="160" x2="900" y2="160" stroke="#1a0010" stroke-width="1"/>
  <line x1="0"   y1="200" x2="900" y2="200" stroke="#1a0010" stroke-width="1"/>
  <line x1="225" y1="0"   x2="225" y2="220" stroke="#1a0010" stroke-width="1"/>
  <line x1="450" y1="0"   x2="450" y2="220" stroke="#1a0010" stroke-width="1"/>
  <line x1="675" y1="0"   x2="675" y2="220" stroke="#1a0010" stroke-width="1"/>

  <!-- Border -->
  <rect width="900" height="220" rx="4" fill="none" stroke="#2a0018" stroke-width="1.5"/>

  <!-- Corner accents -->
  <polyline points="0,30 0,0 30,0"    stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>
  <polyline points="870,0 900,0 900,30"  stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>
  <polyline points="0,190 0,220 30,220"  stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>
  <polyline points="870,220 900,220 900,190" stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#ff0040" letter-spacing="6" filter="url(#sg2)">SYSTEM METRICS</text>
  <line x1="60" y1="33" x2="840" y2="33" stroke="#ff0040" stroke-width="0.5" opacity="0.4"/>

  <!-- ── CARD 1: LANGUAGES ── -->
  <!-- Card bg -->
  <rect x="20" y="44" width="260" height="168" rx="4" fill="#0d0008" stroke="#2a0018" stroke-width="1"/>
  <text x="150" y="62" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#ff0040" letter-spacing="3">LANGUAGES</text>
  <line x1="30" y1="67" x2="270" y2="67" stroke="#ff0040" stroke-width="0.4" opacity="0.5"/>

  <!-- Go -->
  <text x="36" y="86" font-family="'Courier New',monospace" font-size="10" fill="#aaa">Go</text>
  <rect x="80" y="77" width="180" height="10" rx="2" fill="#1a0010"/>
  <rect x="80" y="77" width="162" height="10" rx="2" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="162" dur="1.2s" begin="0.1s" fill="freeze"/>
  </rect>
  <text x="268" y="86" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#ff6633">90%</text>

  <!-- TypeScript -->
  <text x="36" y="105" font-family="'Courier New',monospace" font-size="10" fill="#aaa">TypeScript</text>
  <rect x="107" y="96" width="153" height="10" rx="2" fill="#1a0010"/>
  <rect x="107" y="96" width="137" height="10" rx="2" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="137" dur="1.2s" begin="0.25s" fill="freeze"/>
  </rect>
  <text x="268" y="105" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#ff6633">85%</text>

  <!-- Python -->
  <text x="36" y="124" font-family="'Courier New',monospace" font-size="10" fill="#aaa">Python</text>
  <rect x="88" y="115" width="172" height="10" rx="2" fill="#1a0010"/>
  <rect x="88" y="115" width="137" height="10" rx="2" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="137" dur="1.2s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="268" y="124" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#ff6633">80%</text>

  <!-- C# -->
  <text x="36" y="143" font-family="'Courier New',monospace" font-size="10" fill="#aaa">C#</text>
  <rect x="80" y="134" width="180" height="10" rx="2" fill="#1a0010"/>
  <rect x="80" y="134" width="126" height="10" rx="2" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="126" dur="1.2s" begin="0.55s" fill="freeze"/>
  </rect>
  <text x="268" y="143" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#ff6633">70%</text>

  <!-- JavaScript -->
  <text x="36" y="162" font-family="'Courier New',monospace" font-size="10" fill="#aaa">JavaScript</text>
  <rect x="107" y="153" width="153" height="10" rx="2" fill="#1a0010"/>
  <rect x="107" y="153" width="122" height="10" rx="2" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="122" dur="1.2s" begin="0.7s" fill="freeze"/>
  </rect>
  <text x="268" y="162" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#ff6633">68%</text>

  <!-- Security -->
  <text x="36" y="181" font-family="'Courier New',monospace" font-size="10" fill="#aaa">Security</text>
  <rect x="93" y="172" width="167" height="10" rx="2" fill="#1a0010"/>
  <rect x="93" y="172" width="133" height="10" rx="2" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="133" dur="1.2s" begin="0.85s" fill="freeze"/>
  </rect>
  <text x="268" y="181" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#ff6633">79%</text>

  <!-- ── CARD 2: FOCUS ── -->
  <rect x="320" y="44" width="260" height="168" rx="4" fill="#0d0008" stroke="#2a0018" stroke-width="1"/>
  <text x="450" y="62" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#ff0040" letter-spacing="3">FOCUS AREAS</text>
  <line x1="330" y1="67" x2="570" y2="67" stroke="#ff0040" stroke-width="0.4" opacity="0.5"/>

  <!-- Skill dots -->
  <circle cx="344" cy="84"  r="4" fill="#ff0040" filter="url(#sg2)"/>
  <text x="355" y="88"  font-family="'Courier New',monospace" font-size="11" fill="#e0e0e0">Backend Architecture</text>
  <circle cx="344" cy="106" r="4" fill="#ff0040" filter="url(#sg2)"/>
  <text x="355" y="110" font-family="'Courier New',monospace" font-size="11" fill="#e0e0e0">Penetration Testing</text>
  <circle cx="344" cy="128" r="4" fill="#ff0040" filter="url(#sg2)"/>
  <text x="355" y="132" font-family="'Courier New',monospace" font-size="11" fill="#e0e0e0">Secure Coding</text>
  <circle cx="344" cy="150" r="4" fill="#ff0040" filter="url(#sg2)"/>
  <text x="355" y="154" font-family="'Courier New',monospace" font-size="11" fill="#e0e0e0">Web3 Development</text>
  <circle cx="344" cy="172" r="4" fill="#ff0040" filter="url(#sg2)"/>
  <text x="355" y="176" font-family="'Courier New',monospace" font-size="11" fill="#e0e0e0">System Exploitation</text>
  <circle cx="344" cy="194" r="4" fill="#ff0040" filter="url(#sg2)"/>
  <text x="355" y="198" font-family="'Courier New',monospace" font-size="11" fill="#e0e0e0">Open Source Projects</text>

  <!-- ── CARD 3: STATUS ── -->
  <rect x="620" y="44" width="260" height="168" rx="4" fill="#0d0008" stroke="#2a0018" stroke-width="1"/>
  <text x="750" y="62" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#ff0040" letter-spacing="3">OPERATOR STATUS</text>
  <line x1="630" y1="67" x2="870" y2="67" stroke="#ff0040" stroke-width="0.4" opacity="0.5"/>

  <!-- Animated ring -->
  <circle cx="750" cy="120" r="46" fill="none" stroke="#1a0010" stroke-width="6"/>
  <circle cx="750" cy="120" r="46" fill="none" stroke="#ff0040" stroke-width="3"
          stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round"
          transform="rotate(-90 750 120)" filter="url(#sg2)">
    <animate attributeName="stroke-dashoffset" from="289" to="72" dur="2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <!-- Rotating outer dashes -->
  <circle cx="750" cy="120" r="54" fill="none" stroke="#ff0040" stroke-width="1"
          stroke-dasharray="5 8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 750 120" to="360 750 120" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Center text -->
  <text x="750" y="113" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="#ff0040" filter="url(#sg)">75%</text>
  <text x="750" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="9"  fill="#888">OVERALL</text>

  <!-- Status tags -->
  <rect x="635" y="177" width="86" height="20" rx="3" fill="#1a0010" stroke="#ff0040" stroke-width="0.8"/>
  <circle cx="648" cy="187" r="3" fill="#39ff14">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="656" y="191" font-family="'Courier New',monospace" font-size="9" fill="#fff">ONLINE</text>

  <rect x="731" y="177" width="86" height="20" rx="3" fill="#1a0010" stroke="#ff0040" stroke-width="0.8"/>
  <circle cx="744" cy="187" r="3" fill="#ff0040"/>
  <text x="752" y="191" font-family="'Courier New',monospace" font-size="9" fill="#fff">RED TEAM</text>
</svg>
