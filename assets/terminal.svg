<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" style="background:#0a0009;">
  <defs>
    <filter id="termglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .prompt  { font: 13px 'Courier New', monospace; fill: #ff0040; filter: url(#redglow); }
      .cmd     { font: 13px 'Courier New', monospace; fill: #fff; }
      .out     { font: 13px 'Courier New', monospace; fill: #39ff14; filter: url(#termglow); }
      .dim     { font: 13px 'Courier New', monospace; fill: #555; }
      .cyan    { font: bold 13px 'Courier New', monospace; fill: #00ffff; filter: url(#termglow); }
      .red     { font: bold 13px 'Courier New', monospace; fill: #ff0040; filter: url(#redglow); }
      .yellow  { font: 13px 'Courier New', monospace; fill: #ffd700; }
      .white   { font: bold 13px 'Courier New', monospace; fill: #ffffff; }
      .blink   { animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal window frame -->
  <rect width="900" height="320" rx="8" ry="8" fill="#0a0009" stroke="#330011" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect width="900" height="32" rx="8" ry="8" fill="#1a000d"/>
  <rect y="16" width="900" height="16" fill="#1a000d"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <!-- Title text -->
  <text x="450" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#666">root@cybermatrix ~ [SECURE TERMINAL v2.5.1]</text>

  <!-- Line separator -->
  <line x1="0" y1="32" x2="900" y2="32" stroke="#330011" stroke-width="1"/>

  <!-- Boot sequence lines - each with opacity animation for sequential appearance -->
  <!-- Line 1 -->
  <g opacity="0">
    <text class="dim" x="20" y="58">[ SYS  ]</text>
    <text class="out" x="100" y="58"> Initializing CyberMatrix OS v3.14.0...</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Line 2 -->
  <g opacity="0">
    <text class="dim" x="20" y="76">[ BOOT ]</text>
    <text class="yellow" x="100" y="76"> Loading kernel modules... </text>
    <text class="out" x="490" y="76">[ OK ]</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Line 3 -->
  <g opacity="0">
    <text class="dim" x="20" y="94">[ NET  ]</text>
    <text class="yellow" x="100" y="94"> Establishing encrypted connection... </text>
    <text class="out" x="490" y="94">[ OK ]</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Line 4 -->
  <g opacity="0">
    <text class="dim" x="20" y="112">[ SEC  ]</text>
    <text class="yellow" x="100" y="112"> Scanning for intrusions... </text>
    <text class="out" x="490" y="112">[ CLEAN ]</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Line 5 -->
  <g opacity="0">
    <text class="dim" x="20" y="130">[ AUTH ]</text>
    <text class="yellow" x="100" y="130"> Authenticating user identity... </text>
    <text class="out" x="490" y="130">[ OK ]</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Separator line -->
  <g opacity="0">
    <text class="dim" x="20" y="148">────────────────────────────────────────────────────────────────────────────────</text>
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- whoami prompt + command -->
  <g opacity="0">
    <text class="red" x="20" y="168">root</text>
    <text class="white" x="58" y="168">@cybermatrix</text>
    <text class="out" x="162" y="168">:~$</text>
    <text class="cmd" x="192" y="168"> whoami</text>
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- whoami output block -->
  <g opacity="0">
    <text class="cyan"   x="20"  y="192">  ██████╗  USER    :</text>
    <text class="white"  x="220" y="192">  Muhammed Emir Çeliksu</text>
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.1s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text class="cyan"   x="20"  y="208">  ██╔══██╗ ROLE    :</text>
    <text class="out"    x="220" y="208">  Full Stack Dev  │  Cybersecurity Researcher</text>
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.1s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text class="cyan"   x="20"  y="224">  ███████║ STACK   :</text>
    <text class="yellow" x="220" y="224">  Go · C# · Python · TypeScript · Next.js · NestJS</text>
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.1s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text class="cyan"   x="20"  y="240">  ██╔══██╗ FOCUS   :</text>
    <text class="out"    x="220" y="240">  Penetration Testing · Secure Architecture · Web3</text>
    <animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.1s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text class="cyan"   x="20"  y="256">  ██║  ██║ LOCATION:</text>
    <text class="white"  x="220" y="256">  Turkey 🇹🇷  [ UTC+3 ]</text>
    <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.1s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text class="cyan"   x="20"  y="272">  ╚█████╔╝ STATUS  :</text>
    <text class="red"    x="220" y="272">  ● ONLINE — Available for collaboration</text>
    <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Separator -->
  <g opacity="0">
    <text class="dim" x="20" y="290">────────────────────────────────────────────────────────────────────────────────</text>
    <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- Final prompt with blinking cursor -->
  <g opacity="0">
    <text class="red"   x="20" y="308">root</text>
    <text class="white" x="58" y="308">@cybermatrix</text>
    <text class="out"   x="162" y="308">:~$</text>
    <text class="cmd"   x="192" y="308"> _</text>
    <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.1s" fill="freeze"/>
  </g>
  <!-- Blinking cursor rect -->
  <rect x="202" y="296" width="8" height="14" fill="#00ff41" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;0" keyTimes="0;0.55;0.55;0.75;0.75;0.9;0.9;1" dur="1s" begin="5.2s" repeatCount="indefinite"/>
  </rect>
</svg>
