<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" style="background:#06000d;">
  <defs>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWhite">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip to SVG bounds -->
    <clipPath id="bounds">
      <rect width="900" height="200"/>
    </clipPath>
  </defs>

  <!-- Background with scanlines -->
  <rect width="900" height="200" fill="#06000d"/>
  <!-- Scanlines -->
  <rect width="900" height="1" y="10"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="20"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="30"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="40"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="50"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="60"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="70"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="80"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="90"  fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="100" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="110" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="120" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="130" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="140" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="150" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="160" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="170" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="180" fill="#ffffff" opacity="0.015"/>
  <rect width="900" height="1" y="190" fill="#ffffff" opacity="0.015"/>

  <!-- Corner decorations -->
  <!-- Top-left -->
  <polyline points="10,50 10,10 50,10" stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Top-right -->
  <polyline points="850,10 890,10 890,50" stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Bottom-left -->
  <polyline points="10,150 10,190 50,190" stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Bottom-right -->
  <polyline points="850,190 890,190 890,150" stroke="#ff0040" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Horizontal accent lines -->
  <line x1="60" y1="30" x2="840" y2="30" stroke="#ff0040" stroke-width="0.5" opacity="0.4"/>
  <line x1="60" y1="170" x2="840" y2="170" stroke="#ff0040" stroke-width="0.5" opacity="0.4"/>

  <!-- Side dots -->
  <circle cx="12" cy="100" r="3" fill="#ff0040" opacity="0.7"/>
  <circle cx="888" cy="100" r="3" fill="#ff0040" opacity="0.7"/>

  <!-- ─── MAIN TITLE — three layers for glitch ─── -->
  <!-- Red glitch layer (slightly offset, flickering) -->
  <g clip-path="url(#bounds)" filter="url(#glowRed)">
    <text
      x="453" y="100"
      text-anchor="middle"
      font-family="'Courier New', monospace"
      font-size="52"
      font-weight="bold"
      fill="#ff0040"
      opacity="0.75">Emir Çeliksu</text>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 4,0; -3,0; 0,0; 0,0; 2,0; -4,0; 0,0; 0,0; 0,0"
      keyTimes="0;0.05;0.1;0.2;0.5;0.55;0.6;0.65;0.9;1"
      dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0.75;0.9;0;0.75;0.75;0.9;0;0.75;0.75;0.75"
      keyTimes="0;0.04;0.06;0.08;0.5;0.54;0.56;0.58;0.9;1"
      dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Cyan glitch layer -->
  <g clip-path="url(#bounds)" filter="url(#glowCyan)">
    <text
      x="447" y="100"
      text-anchor="middle"
      font-family="'Courier New', monospace"
      font-size="52"
      font-weight="bold"
      fill="#00ffff"
      opacity="0.6">Emir Çeliksu</text>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -3,0; 5,0; 0,0; 0,0; -4,0; 3,0; 0,0; 0,0; 0,0"
      keyTimes="0;0.05;0.1;0.2;0.5;0.55;0.6;0.65;0.9;1"
      dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0.6;0;0.8;0.6;0.6;0;0.8;0.6;0.6;0.6"
      keyTimes="0;0.04;0.06;0.08;0.5;0.54;0.56;0.58;0.9;1"
      dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- White main layer -->
  <g filter="url(#glowWhite)">
    <text
      x="450" y="100"
      text-anchor="middle"
      font-family="'Courier New', monospace"
      font-size="52"
      font-weight="bold"
      fill="#ffffff">Emir Çeliksu</text>
  </g>

  <!-- Subtitle with typing effect feel -->
  <g filter="url(#glowRed)">
    <text
      x="450" y="140"
      text-anchor="middle"
      font-family="'Courier New', monospace"
      font-size="16"
      fill="#ff0040"
      letter-spacing="6">FULL STACK DEV  ·  CYBERSECURITY</text>
    <animate attributeName="opacity"
      values="1;1;0.3;1;1;0.5;1;1;0.3;1"
      keyTimes="0;0.3;0.32;0.34;0.6;0.62;0.64;0.8;0.82;1"
      dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- Small hex/binary decoration left -->
  <text x="70" y="105" font-family="'Courier New', monospace" font-size="10" fill="#ff0040" opacity="0.4">0x6D65633</text>
  <!-- Small hex decoration right -->
  <text x="780" y="105" font-family="'Courier New', monospace" font-size="10" fill="#ff0040" opacity="0.4">0xFF4444A</text>
</svg>
